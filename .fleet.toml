foldersearcher_core = { src = "system/foldersearcher/foldersearcher_core.py", sha = "799d746dad501595ae5a6c2fd5b521413e032c5c", dest = "src/vendor/foldersearcher_core.py" }
# Not (yet) scaffold-owned — copied from the fleet reference apps the scaffold's
# CLAUDE.md nominates; source repo noted in the key comment.
# app-launcher (1705558a14f12fd35518cc08e2b92ce2b45843d3): app/webapp/event_loop.py (selector loop; code
#   verbatim, only the docstring's issue/port/path references re-pointed at this repo)
# home-automation (25a80d144d3198b1a903499a94f93cc1ba3f4ba1): src/static_versioning.py (canonical
#   BuildInfo/stamp_html/stamp_js; only the no_window import path adapted)

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails on a
# duplicate block (jscpd via npx, Python and JS), an unused import/variable (ruff
# F401,F841) or a likely-bug / security pattern (the scaffold's curated ruff B and S
# codes, S113 strict) that is not in .static-ratchet-baseline.json. Needs Node and ruff in
# the gate's venv; a detector that cannot run exits 3, which fails the gate. Vendored
# copies are duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's docs ratchet. The gate (scripts/verify-before-ship.ps1)
# runs scripts/docs_ratchet.py, which fails when README.md grows past 40 KiB or when
# README.md / docs/**/*.md gains a history marker (issue reference, dated heading,
# changelog heading) beyond .docs-ratchet-baseline.json. A check that cannot run
# exits 3, which fails the gate. Convention: project-scaffolding docs/readme-and-docs.md;
# mechanism + limits: docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"
# The validation record is dated by contract (CLAUDE.md: story, steps, result, date per
# entry), so its walk logs and index are exempt; the feature docs stay measured.
exclude  = ["docs/validation.md", "docs/validation/**"]
# Literal examples, not history: a toast showing a failed task's id, and the quick-add `#12` parent syntax.
allow_refs = ["#36", "#12"]

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when a new
# file passes 1,000 lines, a new function 100 lines or a flat directory 40 modules, when a
# baselined offender grows past its size in .structure-ratchet-baseline.json, when src/
# imports app/, and when the root folders do not match `shape` plus `extra_roots` above.
# Existing offenders are baselined at today's size, never excluded. Exit 3 (git unusable, an
# unparseable file, an unknown shape) fails the gate. Procedure: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's instruction-file lint stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py, which fails when a
# deterministic prompt-audit rule (R-01 to R-12, R-14 size caps, R-15 to R-17, R-30, R-34 to
# R-36, R-45) gains a hit in CLAUDE.md, AGENTS.md or a SKILL.md and its reference docs beyond
# .instruction-ratchet-baseline.json. Existing hits are baselined at today's count, never
# excluded. Exit 3 (git unusable, an unreadable file) fails the gate. Mechanism + limits:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's dangling-reference stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py, which fails when
# README.md, CLAUDE.md or docs/**/*.md names a repo path, python -m module, relative link or
# loopback port that does not exist beyond .doc-refs-ratchet-baseline.json. Existing
# dangling references are baselined, never excluded. Exit 3 (git unusable, an unreadable
# file) fails the gate. Mechanism + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
# The docs name the ports of the services this app talks to on purpose: the local LLM hub
# and the whisper server. The app's own :8448 resolves from `port` above.
allow_refs = [":8000", ":8090"]

# [dead_code_ratchet] -- the scaffold's dead-definition stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py, which fails when a
# tracked Python file gains a function, class or method nothing references (route handlers,
# `__all__`, tests and decorated hooks are entry points) beyond
# .dead-code-ratchet-baseline.json. Existing dead definitions are baselined at their real
# size, never excluded. Exit 3 (git unusable, a file that does not parse) fails the gate.
# Mechanism + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's fleet-convention stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/conventions_ratchet.py, which counts each
# enabled rule's hits per tracked Python file and fails when a count rises above
# .conventions-ratchet-baseline.json. Existing hits are baselined at their real size, never
# excluded. Exit 3 (git unusable, a file that cannot be read or parsed) fails the gate.
# no-window: the app spawns subprocesses on Windows. logging-not-print: src/ and app/ are
# library code (CLI modules are exempt by the rule itself). no-drive-path: no hardcoded
# drive literal. secret-compare and git-wrapper are off: auth.py calls compare_digest in
# place and there is no run_git helper, so neither names a helper to route through.
# Mechanism + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]

# [comment_ratchet] -- the scaffold's comment-history stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py, which counts `#NNN`
# issue references inside product-code comments (.py, .js, .css, .ps1; strings and
# docstrings are not comments) per file and fails when a count rises above
# .comment-ratchet-baseline.json. Tests and vendored destinations are left out by the script
# itself. The baseline is empty: any `#NNN` reference in a comment fails. Exit 3 (git
# unusable, a file that cannot be scanned) fails the gate. Mechanism + limits:
# project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# /perf-review (fleet-config skills/perf-review): "ready" is Today's due-count line
# visible, not first contentful paint, which goes green on a painted shell before any
# task has loaded (#280). The review measures a phone profile, whose landing tab is
# Today (app.js defaultTab, coarse pointer); the line is only rendered once the list
# has landed, and says "nothing due" when there is none, so it shows on an empty install too.
[perf.review]
ready_selector = "#todayHost .today-counts"

# Machine-readable launch recipe for the project-local verify skill
# (.claude/skills/verify-task-os, generated by project-scaffolding's gen_verify_skill.py).
# `_boot` takes (work, db_path, config_path=None, extra_env=None): it needs a scratch
# dir, a DB path and a sample-config copy, so it is a callable, not a bare argv. The
# default data_dir_env (TASK_OS_DATA_DIR) is the variable src/runtime_data.py reads,
# and /healthz is the ready path, so neither is restated.
[verify]
boot           = "tests/e2e/conftest.py::_boot"
live_optin_env = "TASKOS_E2E_LIVE"

# Width follows the shape of the view (fleet-config#1113, design.md Layout): these
# tabs are two-dimensional (lanes, a calendar lane) and span the window; Search
# and Settings keep the 772px measure. The archiving report left the tabs in #397:
# it is the Settings → Email archiving sheet, the detail pane beside the list.
[design]
wide_views = ["board", "today"]

# Diff-proportionate e2e routing (project-scaffolding#180): the gate's browser
# phase is classified by scripts/classify_e2e.py against these rules, first
# match wins; an unmatched path, a mixed diff, or an empty diff fails safe to
# the full suite. Schema: project-scaffolding docs/e2e-routing.md.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# The gate writes this on every routed e2e run (per-test seconds for /e2e-audit).
junit_xml             = "data/e2e-junit.xml"

# Inert assets under the static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]

# A vendored HTML fragment is markup with no behaviour; .css/.js siblings fall
# through to "full" below.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]

# A vendored component's README is documentation the suite never opens (#279).
[[e2e.rule]]
tier       = "none"
prefix     = "app/webapp/static/_vendored/"
extensions = ["md"]

# Real browser surface -> full suite.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
[[e2e.rule]]
tier   = "full"
prefix = "app/tray/"
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
[[e2e.rule]]
tier = "full"
path = "launcher.py"
# What the stories import and read: the fakes (whisper, chat, anthropic, archiver,
# calendar), the seed, the calendar .ics/.html files, and write_test_config. These
# used to fall to the "tests/ -> none" rule below, or to unclassified (#279).
[[e2e.rule]]
tier   = "full"
prefix = "tests/fixtures/"
[[e2e.rule]]
tier = "full"
path = "tests/conftest.py"

# Backend / tooling / docs with no browser impact -> no browser suite.
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py", "json"]
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "opener/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier   = "none"
prefix = "brand/"
[[e2e.rule]]
tier   = "none"
prefix = "assets/"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
[[e2e.rule]]
tier       = "none"
extensions = ["md", "bat", "toml", "ini", "txt"]
[[e2e.rule]]
tier = "none"
path = ".gitignore"
[[e2e.rule]]
tier = "none"
path = ".gitattributes"
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".doc-refs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".dead-code-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".conventions-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = "LICENSE"

# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open
# surface; this app stamps html[data-theme] at load from task-os.theme (else the OS
# scheme), so the hook has to set that key too or its dark shots stay light.
[design.review]
theme_storage_key = "task-os.theme"

# /design-review (fleet-config skills/design-review): Settings is no tab since
# #281 (five destinations is the pill's ceiling) but the header gear, so the
# walk reaches its pane as a click on a fresh load — read-only, it only opens.
[[design.review.extra_steps]]
tab = "board"
id = "settings"
click = "#settingsBtn"

# The task drawer, its row menu and Select mode (#394): read-only clicks on the
# Today list's first row. Opening a drawer or a menu writes nothing; the walk
# types nothing, so the drawer's fields never commit. Desktop Today already
# shows the drawer (it pre-selects the first due task); the phone walks it as
# its full-screen sheet, and `drawer-more` opens More fields as well.
[[design.review.extra_steps]]
tab = "today"
id = "drawer"
click = "#paneToday .trow .trow-main"

[[design.review.extra_steps]]
tab = "today"
id = "drawer-more"
clicks = ["#paneToday .trow .trow-main", "#taskDrawer details.drawer-more > summary"]

[[design.review.extra_steps]]
tab = "today"
id = "row-menu"
click = "#paneToday .trow .trow-kebab"

[[design.review.extra_steps]]
tab = "today"
id = "select"
click = "#paneToday [data-select-toggle]"

# The filter sheet (#395): the strip's filter button opens it. Opening writes
# nothing; the walk ticks and picks nothing, so no filter changes.
[[design.review.extra_steps]]
tab = "today"
id = "filter-sheet"
click = "#paneToday .filter-open"

# The Board's Status mode (#396): Week is the default layout, so the walk
# presses the Week · Status segment to measure the status columns too. The
# press only changes the walk's own remembered layout, never a task.
[[design.review.extra_steps]]
tab = "board"
id = "board-status"
click = "#paneBoard .board-modes [data-mode='status']"

# Settings sheets (#397): the Email archiving sheet (the Archive tab until then —
# opening it only reads the runs; the walk presses neither the run button nor a
# review action) and the Folder opener sheet, the longest text a sheet holds.
[[design.review.extra_steps]]
tab = "today"
id = "settings-archive"
clicks = ["#settingsBtn", "#paneSettings [data-settings-sheet='archive']"]

[[design.review.extra_steps]]
tab = "today"
id = "settings-opener"
clicks = ["#settingsBtn", "#paneSettings [data-settings-sheet='opener']"]
