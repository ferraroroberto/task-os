# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "✅"
port        = ":8448"
tag         = ["→", "GitHub"]
description = "One task list: projects, Inbox capture, calendar, voice add, mail archiving, time tracking."
# The repo layout the structure ratchet holds the root folders to (docs/layout.md).
shape       = "webapp-tray"
extra_roots = ["opener"]  # the per-PC folder opener helper: a standalone installer, not app code

