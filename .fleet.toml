# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "✅"
port        = ":8448"
tag         = ["→", "GitHub"]
description = "<b>task-os</b> — one master task list: nested tasks that become projects, comments + activity log, folder links that open on any PC (taskos:// opener), GitHub/GitLab issues as tasks, folder-index + federated search, a markdown mirror (edit tasks as .md files) + nightly backup. PC-first PWA, phone via Tailscale."

