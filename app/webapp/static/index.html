<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="task-os">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/icons/icon-512.png">
  <!-- Vendored fleet components (project-scaffolding _vendored/, byte-for-byte;
       recorded in .fleet.toml [vendored]). home-head.css must load AFTER
       card.css — it overrides the card's padding for the 52px header row. -->
  <link rel="stylesheet" href="/static/_vendored/card/card.css">
  <link rel="stylesheet" href="/static/_vendored/home-head/home-head.css">
  <link rel="stylesheet" href="/static/_vendored/disclosure/disclosure.css">
  <link rel="stylesheet" href="/static/_vendored/nav/nav-tabs.css">
  <link rel="stylesheet" href="/static/_vendored/button/button.css">
  <link rel="stylesheet" href="/static/_vendored/modal/modal.css">
  <link rel="stylesheet" href="/static/_vendored/empty-state/empty-state.css">
  <link rel="stylesheet" href="/static/_vendored/select-native/select-native.css">
  <link rel="stylesheet" href="/static/_vendored/switch/switch.css">
  <link rel="stylesheet" href="/static/_vendored/page-foot/page-foot.css">
  <link rel="stylesheet" href="/static/styles.css">
  <title>task-os</title>
  <script>
    // Pre-paint theme stamp (design.md "Theme switching"): localStorage
    // override, prefers-color-scheme fallback — before first paint, no flash.
    (function () {
      var t = localStorage.getItem('task-os.theme');
      var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <!-- Lucide sprite — the per-app trim of _vendored/icons/icons-sprite.html.
       Inline (iOS Safari does not resolve external <use> references), hidden
       via the 0-size idiom, never display:none. Glyphs not in the scaffold
       sprite (list-checks, table, list-tree) are pasted from lucide-static
       verbatim, same id/viewBox/fill contract. -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
  <symbol id="i-list-checks" viewBox="0 0 24 24" fill="none">
    <path d="m3 17 2 2 4-4" />
    <path d="m3 7 2 2 4-4" />
    <path d="M13 6h8" />
    <path d="M13 12h8" />
    <path d="M13 18h8" />
  </symbol>
  <symbol id="i-square-kanban" viewBox="0 0 24 24" fill="none">
    <rect width="18" height="18" x="3" y="3" rx="2" />
    <path d="M8 7v7" />
    <path d="M12 7v4" />
    <path d="M16 7v9" />
  </symbol>
  <symbol id="i-table" viewBox="0 0 24 24" fill="none">
    <path d="M12 3v18" />
    <rect width="18" height="18" x="3" y="3" rx="2" />
    <path d="M3 9h18" />
    <path d="M3 15h18" />
  </symbol>
  <symbol id="i-list-tree" viewBox="0 0 24 24" fill="none">
    <path d="M21 12h-8" />
    <path d="M21 6H8" />
    <path d="M21 18h-8" />
    <path d="M3 6v4c0 1.1.9 2 2 2h3" />
    <path d="M3 10v6c0 1.1.9 2 2 2h3" />
  </symbol>
  <symbol id="i-calendar-days" viewBox="0 0 24 24" fill="none">
    <path d="M8 2v4" />
    <path d="M16 2v4" />
    <rect width="18" height="18" x="3" y="4" rx="2" />
    <path d="M3 10h18" />
    <path d="M8 14h.01" />
    <path d="M12 14h.01" />
    <path d="M16 14h.01" />
    <path d="M8 18h.01" />
    <path d="M12 18h.01" />
    <path d="M16 18h.01" />
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none">
    <path d="m21 21-4.34-4.34" />
    <circle cx="11" cy="11" r="8" />
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none">
    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
    <circle cx="12" cy="12" r="3" />
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2" />
    <path d="M12 20v2" />
    <path d="m4.93 4.93 1.41 1.41" />
    <path d="m17.66 17.66 1.41 1.41" />
    <path d="M2 12h2" />
    <path d="M20 12h2" />
    <path d="m6.34 17.66-1.41 1.41" />
    <path d="m19.07 4.93-1.41 1.41" />
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none">
    <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
  </symbol>
</svg>

  <!-- Body-level nav, sibling of <main class="app"> — never nested inside it
       (_vendored/nav/README.md "Pinning the bar (iOS)"). Desktop: top
       segmented control; phone: the floating bottom pill. -->
  <nav class="tabs" role="tablist" aria-label="Primary navigation" data-active-tab="board">
    <button id="tabBoard" type="button" class="tab active" data-tab="board"
            role="tab" aria-selected="true" aria-controls="paneBoard">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-square-kanban"></use></svg>
      <span class="tab-label">Board</span>
    </button>
    <button id="tabTable" type="button" class="tab" data-tab="table"
            role="tab" aria-selected="false" aria-controls="paneTable" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-table"></use></svg>
      <span class="tab-label">Table</span>
    </button>
    <button id="tabTree" type="button" class="tab" data-tab="tree"
            role="tab" aria-selected="false" aria-controls="paneTree" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-list-tree"></use></svg>
      <span class="tab-label">Tree</span>
    </button>
    <button id="tabToday" type="button" class="tab" data-tab="today"
            role="tab" aria-selected="false" aria-controls="paneToday" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-calendar-days"></use></svg>
      <span class="tab-label">Today</span>
    </button>
    <button id="tabSearch" type="button" class="tab" data-tab="search"
            role="tab" aria-selected="false" aria-controls="paneSearch" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
      <span class="tab-label">Search</span>
    </button>
    <button id="tabSettings" type="button" class="tab" data-tab="settings"
            role="tab" aria-selected="false" aria-controls="paneSettings" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
      <span class="tab-label">Settings</span>
    </button>
  </nav>

  <main class="app">
    <!-- Vendored home-head: title glyph + app name + inline status, theme
         toggle pinned right. Shared across every tab (PC-first: one persistent
         header row, not a per-pane repeat). Both glyphs ship; CSS keyed on
         html[data-theme] shows the ACTION (moon in light, sun in dark). -->
    <div class="card home-head">
      <span class="home-title">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list-checks"></use></svg>
        task-os
      </span>
      <span id="homeHeadStatus" class="status"></span>
      <button type="button" id="themeToggle" class="home-toggle hit-target"
              title="Toggle theme" aria-label="Toggle dark mode">
        <svg class="icon theme-icon-moon" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg>
        <svg class="icon theme-icon-sun" aria-hidden="true" focusable="false"><use href="#i-sun"></use></svg>
      </button>
    </div>

    <!-- One <section class="pane"> per tab; every non-default pane starts
         hidden so nothing flashes before nav-tabs.js runs. Each pane body is
         a stack container pinned to minmax(0, 1fr) (design.md Layout). -->
    <section id="paneBoard" class="pane" role="tabpanel" aria-labelledby="tabBoard" aria-label="Board">
      <div class="pane-body" data-empty="tasks"></div>
    </section>
    <section id="paneTable" class="pane" role="tabpanel" aria-labelledby="tabTable" aria-label="Table" hidden>
      <div class="pane-body" data-empty="tasks"></div>
    </section>
    <section id="paneTree" class="pane" role="tabpanel" aria-labelledby="tabTree" aria-label="Tree" hidden>
      <div class="pane-body" data-empty="tasks"></div>
    </section>
    <section id="paneToday" class="pane" role="tabpanel" aria-labelledby="tabToday" aria-label="Today" hidden>
      <div class="pane-body" data-empty="tasks"></div>
    </section>
    <section id="paneSearch" class="pane" role="tabpanel" aria-labelledby="tabSearch" aria-label="Search" hidden>
      <div class="pane-body" data-empty="tasks"></div>
    </section>
    <section id="paneSettings" class="pane" role="tabpanel" aria-labelledby="tabSettings" aria-label="Settings" hidden>
      <div class="pane-body">
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
              This install
            </h2>
            <span class="card-head-meta" id="settingsSite"></span>
          </div>
          <p class="card-meta">Config lives in <code>config/config.json</code> (gitignored; sample committed). Phone install and the Tailscale HTTPS certificate arrive with the phone step.</p>
        </div>
      </div>
    </section>

    <!-- Build identity: outside every card, last child of <main> (vendored
         page-foot). Text set from GET /api/version by app.js. -->
    <footer class="page-foot">
      <p id="buildReadout"></p>
    </footer>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
