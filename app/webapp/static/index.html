  <title>task-os</title>
  <script>
    // Pre-paint theme stamp (design.md "Theme switching"): localStorage
    // override, prefers-color-scheme fallback — before first paint, no flash.
    (function () {
      var t = localStorage.getItem('task-os.theme');
      var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>

  <!-- Body-level nav, sibling of <main class="app"> — never nested inside it
       (_vendored/nav/README.md "Pinning the bar (iOS)"). Desktop: top
       segmented control; phone: the floating bottom pill. -->
  <nav class="tabs" role="tablist" aria-label="Primary navigation" data-active-tab="board">
    <button id="tabBoard" type="button" class="tab active" data-tab="board"
            role="tab" aria-selected="true" aria-controls="paneBoard">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-square-kanban"></use></svg>
      <span class="tab-label">Board</span>
    </button>
    <button id="tabTable" type="button" class="tab" data-tab="table"
            role="tab" aria-selected="false" aria-controls="paneTable" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-table"></use></svg>
      <span class="tab-label">Table</span>
    </button>
    <button id="tabTree" type="button" class="tab" data-tab="tree"
            role="tab" aria-selected="false" aria-controls="paneTree" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-list-tree"></use></svg>
      <span class="tab-label">Tree</span>
    </button>
    <button id="tabToday" type="button" class="tab" data-tab="today"
            role="tab" aria-selected="false" aria-controls="paneToday" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-calendar-days"></use></svg>
      <span class="tab-label">Today</span>
    </button>
    <button id="tabSearch" type="button" class="tab" data-tab="search"
            role="tab" aria-selected="false" aria-controls="paneSearch" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
      <span class="tab-label">Search</span>
    </button>
    <button id="tabSettings" type="button" class="tab" data-tab="settings"
            role="tab" aria-selected="false" aria-controls="paneSettings" tabindex="-1">
      <svg class="tab-icon" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
      <span class="tab-label">Settings</span>
    </button>
  </nav>

  <main class="app">
    <!-- Vendored home-head: title glyph + app name + inline status, theme
         toggle pinned right. Shared across every tab (PC-first: one persistent
         header row, not a per-pane repeat). Both glyphs ship; CSS keyed on
         html[data-theme] shows the ACTION (moon in light, sun in dark). -->
    <div class="card home-head">
      <span class="home-title">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list-checks"></use></svg>
        task-os
      </span>
      <span id="homeHeadStatus" class="status"></span>
      <button type="button" id="themeToggle" class="home-toggle hit-target"
              title="Toggle theme" aria-label="Toggle dark mode">
        <svg class="icon theme-icon-moon" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg>
        <svg class="icon theme-icon-sun" aria-hidden="true" focusable="false"><use href="#i-sun"></use></svg>
      </button>
    </div>

    <!-- One <section class="pane"> per tab; every non-default pane starts
         hidden so nothing flashes before nav-tabs.js runs. Each pane body is
         a stack container pinned to minmax(0, 1fr) (design.md Layout). -->
    <section id="paneBoard" class="pane" role="tabpanel" aria-labelledby="tabBoard" aria-label="Board">
      <div class="pane-body">
        <div class="quick-add" data-quick-add="board"></div>
        <div data-empty="tasks"></div>
      </div>
    </section>
    <section id="paneTable" class="pane" role="tabpanel" aria-labelledby="tabTable" aria-label="Table" hidden>
      <div class="pane-body">
        <div class="quick-add" data-quick-add="table"></div>
        <!-- Column filter bar: its state is the URL query (?status=doing&project=12)
             so a view is shareable; app.js keeps both in sync. -->
        <div class="card filter-bar" id="tableFilters" hidden></div>
        <div id="tableHost" data-empty="tasks"></div>
      </div>
    </section>
    <section id="paneTree" class="pane" role="tabpanel" aria-labelledby="tabTree" aria-label="Tree" hidden>
      <div class="pane-body">
        <div class="quick-add" data-quick-add="tree"></div>
        <div id="treeHost" data-empty="tasks"></div>
      </div>
    </section>
    <section id="paneToday" class="pane" role="tabpanel" aria-labelledby="tabToday" aria-label="Today" hidden>
      <div class="pane-body" data-empty="tasks"></div>
    </section>
    <section id="paneSearch" class="pane" role="tabpanel" aria-labelledby="tabSearch" aria-label="Search" hidden>
      <div class="pane-body" data-empty="tasks"></div>
    </section>
    <section id="paneSettings" class="pane" role="tabpanel" aria-labelledby="tabSettings" aria-label="Settings" hidden>
      <div class="pane-body">
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
              This install
            </h2>
            <span class="card-head-meta" id="settingsSite"></span>
          </div>
          <p class="card-meta">Config lives in <code>config/config.json</code> (gitignored; sample committed). Phone install and the Tailscale HTTPS certificate arrive with the phone step.</p>
        </div>
      </div>
    </section>

    <!-- Build identity: outside every card, last child of <main> (vendored
         page-foot). Text set from GET /api/version by app.js. -->
    <footer class="page-foot">
      <p id="buildReadout"></p>
    </footer>

    <!-- Task drawer: a right-hand side panel on desktop (>= 1024px, fixed,
         the content shrinks so it never covers the list); a full-screen sheet
         on the phone. Deep-linkable as #task/<id>. Body built by drawer.js. -->
    <aside id="taskDrawer" class="drawer card" role="dialog" aria-modal="false"
           aria-labelledby="drawerTitle" hidden></aside>
  </main>

  <!-- Toasts: user-initiated command results / errors (design.md "Async data
       & feedback") — one polite live region, assertive for errors. -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
