      - "Settings → Database · `#settings/install`."
  - id: settings.mirror
    area: settings
    title: Mirror and backup sheet
    root: data-surface
    reach:
      - "Settings → Mirror and backup · `#settings/mirror`."
    states:
      - gone when Mirror and backups is off.
  - id: settings.time-menu
    area: settings
    title: Time categories menu (⋮)
    root: data-surface
    reach:
      - the ⋮ beside an area or a category in the Time categories sheet.
    holds:
      - >-
        Rename or Edit, Move up, Move down, Move to another area, Archive, and Delete only while
        nothing points at it.
  - id: archive.report
    area: settings
    title: Email archiving report
    root: data-surface
    reach:
      - "Settings → Email archiving · palette *Go to Archive*."
    states:
      - >-
        *No run yet*, running (the run button reads *Archiving…* and is disabled), not configured
        with the reason, a run that failed with its reason. See [Archive the
        Inbox](inbox-archive.md#archive-the-inbox).
    phone: >-
      cards, with the review levels behind **Review**. Each row's **⋮** offers exactly what its
      state allows: **Accept** (a mail that needed a human), **Move to… / File it…** (the ranked
      candidates or any folder through the folder picker, with an optional hint the next run
      remembers), **Retry** (the file was written before Outlook refused the move), **Revert**
      (files deleted, mail back to the Inbox; only a filed row). A run picker lists earlier runs and
      **Accept all (N)** clears a reviewed batch; anything touching files asks first.
    desktop: >-
      a table (subject with who and when · destination as its last three components · files as
      chips, the first shown and *+N more* · confidence · why · state).
    links:
      - to: folder.picker
      - to: confirm.dialog
      - to: archive.row-menu
        via: the ⋮ on a desktop row
  - id: archive.row-menu
    area: settings
    title: Report row menu (⋮)
    root: data-surface
    reach:
      - the ⋮ on a desktop report row.
    holds:
      - "exactly the actions the row's state allows (see the report above)."

  # --- Sign-in and team name --------------------------------------------------
  - id: login.card
    area: login
    title: Sign-in
    root: data-surface
    reach:
      - "(`/login`, public)"
    holds:
      - >-
        a card with one field (*Token or password*) and **Sign in**; a wrong secret says *wrong
        token or password*. A token or password sets a 90-day cookie. With team mode on, the team
        password signs in and leads to **login.name-picker**. Not reached on the install's own PC,
        which needs no credential.
    links:
      - to: login.name-picker
      - to: today.list
  - id: login.name-picker
    area: login
    title: Name picker
    root: data-surface
    holds:
      - >-
        *Who are you?* with one button per member (initials and name, the first focused). It sets a
        label recorded on comments and changes, never a credential; *change name* in Settings →
        Phone access returns here.
    links:
      - to: today.list

  # --- Overlay catalog --------------------------------------------------
  - id: confirm.dialog
    area: overlays
    title: Confirm dialog
    root: data-surface
    reach:
      - >-
        every delete (a task from the drawer, a selection from the bulk bar, a time entry), an
        archive file action.
    holds:
      - "a title, a line naming what goes, **Cancel** and one danger-tinted action."
    does:
      - "the action runs the write; **Cancel**, Escape and the backdrop mean no."
    why: "one destructive-action dialog, built per ask."
  - id: chip.folder-popover
    area: overlays
    title: Folder and conversation popover
    root: data-surface
    reach:
      - >-
        a folder chip, or an AI-conversation chip, on a fine pointer; on a phone a folder with no
        web address shows the path to copy here.
    holds:
      - >-
        the resolved path with **Copy**, or **Open conversation** and, for a Claude Code session,
        **Resume in CLI on this PC**.
    does:
      - Escape or an outside click closes it without closing the drawer under it.
