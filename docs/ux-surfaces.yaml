      A modal hides the phone's floating nav while it is open.

surfaces:

  # --- Chrome --------------------------------------------------
  - id: chrome.header
    area: chrome
    title: Header
    root: data-surface
    reach:
      - "always on screen, above every pane."
    holds:
      - >-
        a glyph and title naming the tab on screen, a status line beside it, the theme toggle, the
        Settings gear.
    does:
      - >-
        the gear opens the Settings page over the tab; the toggle flips light and dark.
    states:
      - >-
        the status line names exceptions per view: Today *2 overdue · 3 due today* (or a muted
        *Nothing due today*), Board *4 in Inbox · 3 overdue*. On an install with no tasks Today,
        Board and the Done journal read *No tasks yet*, while Time and Search keep their own line,
        and *Server unreachable* replaces it when the server cannot be reached. The Settings page
        carries its own line (see Settings).
    why: one persistent header row rather than a heading per pane.
    links:
      - to: settings.pane
  - id: chrome.nav
    area: chrome
    title: Nav
    root: data-surface
    reach:
      - always.
    holds:
      - four tabs with a glyph and label; the active one is tinted.
    does:
      - >-
        switches the pane; Arrow keys move between tabs. A deep link beats the remembered tab; the
        last tab is remembered per browser.
    states:
      - Time absent when its block is off.
    why: >-
      the fleet nav contract caps the bar at five; Settings is the rarely-used destination, so it is
      the gear.
    links:
      - to: today.list
      - to: board.pane
      - to: time.pane
      - to: search.pane
  - id: chrome.footer
    area: chrome
    title: Footer
    root: data-surface
    holds:
      - >-
        build line (identity of the running build), last child of the page, outside every card.
  - id: chrome.toast
    area: chrome
    title: Toast
    root: data-surface
    reach:
      - after a user-initiated write or an error; passive status renders inline instead.
    holds:
      - >-
        one message at a time, pinned above the nav, with an optional **Undo (Z)** button.
    does:
      - >-
        Undo writes the inverse change; it and the `z` key expire together after ten seconds. Bulk
        results name any task that failed.
    states:
      - "neutral, or tinted for an error."
  - id: app.update-banner
    area: chrome
    title: New-version notice
    root: data-surface
    holds:
      - (stamped by the vendored build-watch component itself).
      - >-
        a banner offering **Reload** when the server moved to a newer build while the page stayed
        open (an installed phone app in memory across a restart). It is dismissible and never
        reloads by itself, so a typed draft survives.
  - id: chrome.install-shell
    area: chrome
    title: Install shell
    root:
      none: "the manifest and the standalone display, with no element of their own."
    holds:
      - >-
        the page is an installable app (manifest, standalone display); the installed app adds a
        strip above the status bar and keeps the nav at the bottom edge.

  # --- Today --------------------------------------------------
  - id: today.list
    area: today
    title: List
    root: data-surface
    holds:
      - >-
        the [top strip](#shared-strip-above-every-list), then the calendar lane and four horizons.
        Kind of task and whose tasks are rows of the strip's Filters & sort sheet.
    does:
      - >-
        the horizons are **Due** (overdue first, then today; no heading, the header names it),
        **Soon** (tomorrow to a week out), **Later** and **No date** (each shows only when it holds
        something). Soon, Later and No date sit under the Board's group header (name and count,
        no rule, no chevron) and are always open: nothing folds. Inside a horizon rows run by due
        day, no project first, project A–Z, title.
    states:
      - >-
        empty install shows *Add your first task* with an **Add a task** button; a filter with no
        match shows an empty line; counts sit on the group headers.
    desktop: the list scrolls inside its own box under the strip at 1024px and up.
    links:
      - to: strip.top
      - to: today.calendar-lane
      - to: row.item
      - to: today.detail-split
        via: desktop
  - id: today.detail-split
    area: today
    title: Detail split
    root: data-surface
    phone: the drawer is a full-screen sheet.
    desktop: >-
      (1024px and up): the right half is the [drawer](#task-drawer), never empty while a task is
      due: arriving on Today shows the first due task without writing a `#task/` link. With nothing
      due, or after closing, it reads *Select a task to see its details*. Leaving Today closes it.
  - id: today.calendar-lane
    area: today
    title: Calendar lane
    root: data-surface
    reach:
      - above the horizons when the calendar block and an ICS address are configured.
    holds:
      - "an all-day band of chips, timed events with their span, an event count."
    does:
      - read-only; nothing is written back.
    states:
      - >-
        a failing feed shows a notice titled by cause (*address refused*, *unreachable*, *did not
        answer in time*, *feed unreadable*) with the time it began failing and the last good copy
        kept; a feed that parses but has events it could not evaluate says how many (*N recurring
        event(s) could not be checked — open the calendar itself*). Settings → Calendar holds the
        status and a refresh.
    why: "your real calendar beside the task list, without any write path."

  # --- Board --------------------------------------------------
  - id: board.pane
    area: board
    title: Board
    root: data-surface
    reach:
      - nav.
    holds:
      - >-
        the top strip, then the week lanes or the status columns. Two-dimensional, so it spans the
        window on desktop. The layout, the kind of task, whose tasks and Triage are rows of the
        strip's Filters & sort sheet.
    links:
      - to: journal.pane
        via: "Done column: journal"
      - to: strip.top
      - to: row.item
      - to: board.week-lanes
        via: Week mode
      - to: board.status-columns
        via: Status mode
  - id: board.week-lanes
    area: board
    title: Week lanes
    root: data-surface
    holds:
      - >-
        **Today** (overdue included) · **Tomorrow** · **This week** · **This weekend** · **Next
        week** · **Later** (no-date tasks close it under a *No date* sub-heading).
    does:
      - >-
        drag a row onto a lane to re-date it to that lane's first day (toast and Undo, nothing but
        the due date changes).
    why: >-
      every date belongs to exactly one lane, so *This week* and *This weekend* show only while they
      have days left after tomorrow.
    phone: "one list of lane sections, rows swipe, no drag."
    desktop: >-
      lanes side by side, each scrolling under a sticky header with its count; an empty lane
      collapses to its header and stays a drop target.
  - id: board.status-columns
    area: board
    title: Status columns
    root: data-surface
    holds:
      - >-
        **Inbox · Todo · Standby · Done today**; drag a row to change its status; ticking statuses
        in the filter sheet hides the other columns. The Done column head carries a **journal** link
        ([journal](#done-journal)).
    phone: >-
      a one-column scroll-snap carousel whose count strip (*Inbox 4 · Todo 30 …*) is also the column
      switcher; no row swipe here because the columns already swipe sideways.
    links:
      - to: board.row-panel
        via: open a task
      - to: board.ai-suggestion
        via: Inbox rows
  - id: board.ai-suggestion
    area: board
    title: AI suggestion strip
    root:
      none: a line the row builder adds under an Inbox row.
    reach:
      - under an Inbox row after Triage staged a suggestion.
    holds:
      - >-
        a one-line summary (parent · priority · due · person) with its reason on hover and
        **Accept** and **Reject** icon buttons.
    why: nothing is applied until accepted.
  - id: board.row-panel
    area: board
    title: Row panel
    root:
      none: "the task drawer ([`drawer.panel`](#task-drawer)) placed beside the lanes."
    phone: full-screen sheet.
    desktop: opening a card shows the drawer as a 440px side panel beside the lanes.

  # --- Shared strip above every list --------------------------------------------------
  - id: strip.top
    area: strip
    title: Top strip
    root:
      none: >-
        one strip sits in each of Today, Board and the journal, so no single element carries it.
    holds:
      - >-
        on one line, and nothing under it: the live **text filter** (placeholder carries the
        count, *Filter 12 tasks…*), the **filter button** (carries how many filters are on; its
        name spells them), **+**, and on a wide screen **Select** (on a phone Select is a row of the filter sheet, and the strip shows it only while Select mode is on, as **Done**). Today, Board and the Done journal carry it; Search carries its own box and the
        filter button inside it.
    links:
      - to: strip.filter-sheet
      - to: strip.quick-add
      - to: strip.bulk-bar
  - id: strip.filter-sheet
    area: strip
    title: Filters & sort sheet
    root: data-surface
    reach:
      - filter button.
    holds:
      - >-
        **sort** (Due · Priority · Modified · Created · Title); on Today and Board the view
        toggles under it: **Select tasks** (enters Select mode and closes the sheet), **Layout** (Week · Status, Board only), **AI triage** (Board, Status
        layout, while the Inbox holds tasks; pressing it closes the sheet),
        **Kind of task** and **Whose tasks**; then **status**
        ticks (including `done` and `cancelled`), **project**, **person** ticks, **due window**,
        **modified window** (including *untouched over 30/60/90 days*, the stale pass), **Clear**
        (only while something is on), **Done**. On Search the status ticks are drawn with the open
        statuses ticked, and un-ticking them all means every status; on Today and Board no ticks means
        open tasks until the text field holds a query, then every status, named at the end of the header line.
    does:
      - >-
        applies live; the state is the URL. The filter button's count adds the kind of task and
        whose tasks when they are off their default, and Clear resets them. The layout hides
        nothing, so it is neither counted nor cleared. On Search and the journal the sheet has no
        view toggles and Clear leaves the scope and person row alone.
    phone: >-
      a full-screen sheet with ticks two to a line. In the journal, status, due, modified and sort
      are hidden.
  - id: strip.scope
    area: strip
    title: Scope switch
    root: data-surface
    reach:
      - the **Kind of task** row of the Today and Board Filters & sort sheet; under the box on Search.
    holds:
      - >-
        **Tasks · Issues · All** (`?scope=`). Tasks (default) leaves out issues the forge sync
        brings in.
  - id: strip.person-row
    area: strip
    title: Person row
    root: data-surface
    reach:
      - two or more members; the **Whose tasks** row of the Today and Board Filters & sort sheet.
    holds:
      - >-
        **Mine** · each member · **Everyone**; with more than three other members the row keeps the
        picked and recent ones and folds the rest into **+N more**.
    does:
      - >-
        one tap picks one person; **+N more** opens **strip.people-sheet**. Mine and Everyone are
        per device (`?whose=everyone`); picked members ride `?owner=`. Search ignores the row and
        always covers everyone.
    why: "each phone signs in as its own member, so Mine needs no picker step."
    links:
      - to: strip.people-sheet
        via: "+N more"
  - id: strip.people-sheet
    area: strip
    title: People sheet
    root: data-surface
    reach:
      - "**+N more**."
    holds:
      - >-
        a name filter, one tick per member, **Done**. The only place several people are picked at
        once; an emptied set falls back to Mine.
  - id: strip.bulk-bar
    area: strip
    title: Select mode and bulk bar
    root: data-surface
    reach:
      - "**Select tasks** in the Filters & sort sheet; on a wide screen **Select** on the strip."
    does:
      - >-
        every row becomes a tick target (drag and phone swipe off; one selection shared across Today
        and Board). With one or more ticked the bar replaces the strip: *N selected* · **Move**
        (date sheet, [date sheet](#the-task-row)) · **Set status…** (native select: inbox, todo,
        standby, complete, done, cancelled) · **Set owner…** (two or more members) · **Delete**
        (confirm names the count, projects whose children go too, and synced issue tasks the next
        sync would bring back) · **Leave select mode**. Escape leaves. On a phone, before anything is ticked, the strip's **Done** leaves.
    states:
      - a task that fails in a bulk write is named in the toast.
    links:
      - to: row.date
      - to: confirm.dialog
  - id: strip.quick-add
    area: strip
    title: Quick-add dialog
    root: data-surface
    reach:
      - "**+** · palette *New task* · no-tasks button."
    holds:
      - >-
        the title line (natural language, parsed on the server: trailing date, `starts`, `#id` or `›
        parent`), a **Dictate** mic, then **Project** (a select of the open projects, opening on the
        project the list is filtered to) and **Owner** (the members, opening on the viewer; absent
        for one member), description, due, starts, status, folder (typed or **Find
        in folder index**), one link (URL and label). The parsed parent shows as a chip and wins over the
        picked project, a parent
        that matches nothing as a red chip and nothing is created.
    does:
      - >-
        **Add** or Enter creates and focuses the row; Escape, the backdrop and × discard.
    states:
      - >-
        dictation shows listening, settling and unreachable-service states. See
        [Views](views.md#views).
    links:
      - to: folder.picker

  # --- The task row --------------------------------------------------
  - id: row.item
    area: row
    title: Row
    root: data-surface
    holds:
      - >-
        leading **project pill** (Today and Board) · one-line title · one meta line (context name,
        then due, exception chips, counts). Tapping anywhere opens the drawer.
    why: nothing on the meta line is a target; 60px a row.
    links:
      - to: row.menu
      - to: row.date
      - to: drawer.panel
        via: tap / Enter
      - to: row.complete
        via: mouse
      - to: row.move
        via: mouse
      - to: row.swipe
        via: touch
  - id: row.complete
    area: row
    title: Completion circle
    root:
      none: >-
        a control on the row. *Mouse only.* Completes an open task (a recurring one rolls) or
        reopens a closed one, with Undo.
  - id: row.move
    area: row
    title: Move verb
    root:
      none: >-
        a control on the row. *Mouse only, open rows outside Board lanes.* A calendar glyph button;
        opens the date popover.
    why: re-dating is most of what is done to a task.
  - id: row.menu
    area: row
    title: Row menu (⋯)
    root: data-surface
    reach:
      - "kebab · right-click · `.` · the menu key on a focused row."
    holds:
      - >-
        the actions in the order set in Settings → Row actions: Complete or Reopen, **Move…**,
        Status (inbox, standby, cancelled, todo as it applies), **Cycle priority**, Due tomorrow,
        Due next week; then, when the task has them, **Open folder**, **Open AI conversation** (and
        **Resume in CLI** for a resumable session), **Open issue `repo#N`**; last **Open details**.
    why: >-
      one table of actions (`actions.js`) feeds the menu, the keys, the palette and the swipes.
    links:
      - to: row.date
      - to: drawer.panel
  - id: row.date
    area: row
    title: Date sheet / popover
    root: data-surface
    reach:
      - >-
        the Move verb, a swipe left, the menu's Move…, `d`, Select mode's Move, the drawer's quick
        moves.
    holds:
      - >-
        **Tomorrow · This weekend · Next week · Today**, each with the date it lands on, then **Pick
        a date…** (a native date field) and **No date**.
    phone: >-
      a bottom sheet (a dialog). One pick moves the task and leaves it on the list, with Undo.
    desktop: a popover next to the row.
  - id: row.swipe
    area: row
    title: Swipe
    root:
      none: >-
        a gesture, with no element of its own. *Touch only, open rows in a vertical list.* Right
        completes, left opens the date sheet by default; both are configurable.
    holds:
      - >-
        Starts away from the screen edge, locks sideways, commits past 96px or a quick flick, never
        in the phone Board's Status carousel. Revealed label turns to *Release to …* when armed.

  # --- Task drawer --------------------------------------------------
  - id: drawer.panel
    area: drawer
    title: Task drawer
    root: data-surface
    reach:
      - >-
        a row tap or Enter · menu *Open details* · `#task/<id>` · Today's auto-opened first task.
    holds:
      - "the blocks below, in order."
    phone: "full-screen. Escape or **Close** closes it (then leaves Select mode)."
    desktop: side panel or split pane;
    links:
      - to: drawer.parent-picker
      - to: folder.picker
      - to: confirm.dialog
      - to: drawer.fields
        via: a block inside the drawer
      - to: drawer.description
        via: a block inside the drawer
      - to: drawer.title
        via: a block inside the drawer
      - to: drawer.links
        via: a block inside the drawer
      - to: drawer.activity
        via: a block inside the drawer
      - to: drawer.head
        via: a block inside the drawer
      - to: drawer.more
        via: a block inside the drawer
      - to: drawer.due
        via: a block inside the drawer
      - to: drawer.issue
        via: a block inside the drawer
      - to: drawer.delete
        via: a block inside the drawer
      - to: drawer.comments
        via: a block inside the drawer
  - id: drawer.head
    area: drawer
    title: Head
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        breadcrumb (clickable), **Change parent** (opens [parent picker](#task-drawer)), **Remove
        parent** (only with a parent; no confirm, no Undo), **Close**, and the task's number.
    links:
      - to: drawer.parent-picker
        via: Change parent
  - id: drawer.title
    area: drawer
    title: Title
    root:
      none: a block inside the drawer panel.
    holds:
      - an editable field with a visible boundary.
  - id: drawer.due
    area: drawer
    title: Due + quick moves
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        a date field with a calendar button, then *Tomorrow · This weekend · Next week · Today* with
        their dates. Due comes first because most edits push it out.
  - id: drawer.fields
    area: drawer
    title: "Status, Priority, Owner"
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        native selects; Owner only with two or more members (an `owner old → new` activity row names
        who).
  - id: drawer.links
    area: drawer
    title: Links
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        pills for the folder, the issue and every link; an AI-conversation URL wears the bot chip; a
        folder chip is a `taskos://` link opened by the per-PC opener (the phone shows the path to
        copy).
    links:
      - to: chip.folder-popover
        via: a folder or conversation chip
  - id: drawer.description
    area: drawer
    title: Description
    root:
      none: a block inside the drawer panel.
    holds:
      - "markdown, a pencil toggles edit and preview."
  - id: drawer.comments
    area: drawer
    title: Comments
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        newest first, a composer (**Send**, Ctrl+Enter), per comment a **pencil** (edit in place,
        Ctrl+Enter saves, Escape cancels) and a **trash** (asks first, no undo); URLs, `{folder}`
        refs and `repo#N` render as chips.
  - id: drawer.activity
    area: drawer
    title: Activity
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        `field old → new · actor · time`; issue-sync rows fold behind *Show N sync updates*.
  - id: drawer.parent-picker
    area: drawer
    title: Parent picker
    root: data-surface
    holds:
      - >-
        a centred card on desktop, full screen on the phone: a filter field (*Filter N open tasks*)
        over every open task in tree order, indented, each with its path; the task itself, its
        descendants and closed tasks are not offered. Tap or Enter on the first match files it; a
        cycle is refused with a toast. The one way to re-parent.
  - id: drawer.more
    area: drawer
    title: More fields
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        a disclosure closed by default whose summary names what is set (*starts in 3d · repeats · 1
        blocker*); once opened it stays open for the page's life. Inside: **Starts** (a date; the
        only place the start date is edited), **Repeat** (never/daily/weekly/monthly, every N, the
        fixed day), **Person** (the contact a task is about, not the owner), **Code**, **Folder**
        (typed ref or **Find in folder index**), **Edit links** (label edit, remove, **Add link**),
        **Blocked by** (**Add blocker**), **Children** (click to navigate, **Add child**), and the
        **Issue panel**.
  - id: drawer.issue
    area: drawer
    title: Issue panel
    root:
      none: a block inside the drawer panel.
    holds:
      - >-
        a linked issue shows its provider glyph, `repo#N`, state, labels, last-synced time, **Sync
        now** and **Unlink**; a plain task shows **Create issue** (repo from the last-seen list or
        typed) and **Link existing** (`owner/repo#N` or URL). Gone when Issue sync is off. See
        [Issues as tasks](issues-as-tasks.md#issues-as-tasks).
  - id: drawer.delete
    area: drawer
    title: Delete task
    root:
      none: "it opens [`confirm.dialog`](#overlay-catalog)."
    holds:
      - >-
        last and quiet. A confirm names the task and its subtree, says there is no trash and no
        undo, and for a synced task with an open issue warns the next sync recreates it. A toast
        says how much went.
  - id: folder.picker
    area: drawer
    title: Folder picker
    root: data-surface
    holds:
      - >-
        a search-as-you-type list over the folder index with **Find in folder index** as its opener;
        Enter attaches the first hit, Escape closes the picker first. Shared by the drawer, the
        quick-add dialog and Email archiving's file-it panel.
    states:
      - the index not configured or unavailable says so instead of listing nothing.

  # --- Time --------------------------------------------------
  - id: time.pane
    area: time
    title: Time
    root: data-surface
    reach:
      - nav.
    holds:
      - "the **Log · Totals · History** segment under the header and the view it picks."
    states:
      - >-
        hidden when its block is off. One-dimensional (772px measure). See [Time
        tracking](time-tracking.md#time-tracking).
    links:
      - to: time.log
      - to: time.totals
      - to: time.history
      - to: time.person-picker
  - id: time.log
    area: time
    title: Log
    root: data-surface
    holds:
      - >-
        *Today so far* (per person, with each person's running state), **Start a timer** (Recent
        first, then each area with its categories as large tiles, each with its subtitle), **Add
        time already spent**.
    does:
      - >-
        tapping a tile starts a timer; with one running, a **Stop and start …** choice replaces the
        timer in one call. A running timer's tile reads *Running now* and the card shows **Stop and
        save** and **Discard** (immediate, with a *Timer discarded* toast and no undo). Past the
        long-timer limit the card asks whether the timer was forgotten and lets you correct the
        minutes. A running timer is the server's: a reload or another device shows the same one.
    links:
      - to: time.dialog
  - id: time.totals
    area: time
    title: Totals
    root: data-surface
    holds:
      - >-
        **Today · 7 days · 30 days · All**, an **Area** filter, **Me · Everyone** when there are
        several people, a total, per-category bars, and on the compare area with two or more people
        the head-to-head, the split bar, days logged per person, a **How the comparison works** info
        dialog and **Guess your share** (**Lock in**; the other guess stays hidden until yours is
        locked), **Download CSV**. People differ by initials and fill, never by colour.
  - id: time.history
    area: time
    title: History
    root: data-surface
    holds:
      - >-
        every entry by day with its clock range or, for an imported entry, its duration; each row's
        **More actions** holds **Edit**, **Start again** and **Delete** (confirmed).
    links:
      - to: time.dialog
      - to: time.history-menu
  - id: time.history-menu
    area: time
    title: History row menu (⋮)
    root: data-surface
    reach:
      - "a history row's **More actions**."
    holds:
      - "**Edit**, **Start again**, **Delete** (confirmed)."
  - id: time.dialog
    area: time
    title: Time dialogs
    root: data-surface
    holds:
      - >-
        **Add time already spent / Edit entry** (person, category, day with Today and Yesterday,
        start, minutes with 15/30/45/60/90/120 chips, note), **A timer is running** (the switch
        choice), text prompts and option pickers for categories, and a plain info dialog. Closed by
        × or Escape.
  - id: time.person-picker
    area: time
    title: Person picker
    root: data-surface
    holds:
      - >-
        on first visit when a team sign-in names nobody in the install, a one-time question of who
        is logging, kept in memory only.

  # --- Search and command palette --------------------------------------------------
  - id: search.pane
    area: search
    title: Search tab
    root: data-surface
    reach:
      - "nav · `#search` · Go to Search."
    holds:
      - >-
        an auto-focused box (a **Clear search** button that shows only while the box holds text, a
        filter button, and the scope switch under it), a count, and results. *Clear search* is a
        44px target; one tap empties the query, the count and the results, and keeps focus in the
        box (Escape in the box does the same). A group appears only for a kind with hits (Tasks,
        Folders, Emails, Issues), open, under an uppercase header with its count; every other kind
        folds into one line (*No matches in …*, *Not set up: …*). Task hits are the standard row
        plus the matched snippet, exact first, then *Partial matches*, then *Similar matches*; other
        hits are a title and one meta line whose single control opens them. The count line ends with
        the statuses the task hits cover (*open only*, *every status*, or the ticked ones), and the
        *No matches* line names them after Tasks.
    states:
      - >-
        folder-explorer answering badly is its own line per kind, never *No matches*: *unreachable*,
        *indexing*, *not set up*, *failed*, with the reason; a broken index is shown in the danger
        tone. *Keys:* Down from the box focuses the first row, Up and Down move, Enter opens, Escape
        or `/` returns to the box.
    why: "the 200ms debounce and the *`?q=`* URL make a search shareable."
    links:
      - to: strip.scope
      - to: row.item
      - to: drawer.panel
      - to: keys.help
  - id: search.palette
    area: search
    title: Command palette
    root: data-surface
    reach:
      - >-
        Ctrl+K or Cmd+K from any tab · Settings → Command palette → **Open command palette** (the
        phone's only way; the header has no button).
    holds:
      - >-
        a box; plain text jumps to a task (top eight: title, breadcrumb, status); `>` lists
        commands. Commands: *New task* · the row actions for the focused or ticked task (first while
        one is targeted) · *Go to Today / Board / Time / Archive / Search / Settings* · *Journal* ·
        *Filter: status inbox / todo / standby / done / cancelled* · *Filter: clear* · *Sync issues*
        · *Export mirror* · *Open folder of current task* · *Toggle theme* · *Sign out*. Commands of
        a switched-off block are omitted. Up/Down move, Enter runs, Escape closes.
    phone: a full-width sheet.
    links:
      - to: journal.pane
        via: Journal command
      - to: drawer.panel
      - to: today.list
      - to: settings.pane
  - id: keys.help
    area: search
    title: Keyboard shortcuts sheet
    root: data-surface
    reach:
      - >-
        `?`. A list of every key (below), including the ones the palette shows with their key.

  # --- Done journal --------------------------------------------------
  - id: journal.pane
    area: journal
    title: Journal
    root: data-surface
    reach:
      - >-
        the Board's Done column head (**journal**) · palette *Journal* · `#journal`,
        `#journal/task/<id>`.
    holds:
      - >-
        the shared text strip and filter sheet (project, person, text), a **Show cancelled** toggle,
        closed tasks newest day first under one heading per local day (*Yesterday · Tue 1 Sep · 2
        done*), cancelled ones muted, **Show the week before** to widen by seven days.
    does:
      - the filled circle reopens a task in place; the row opens the drawer.
    states:
      - >-
        it says it has reached the end only once the server confirms nothing closed earlier; an
        install with nothing closed says so. Any tab press leaves.
    why: "a reading surface (the answer to \"what happened this week\"), not a tab."
    links:
      - to: strip.top
      - to: row.item

  # --- Settings --------------------------------------------------
  - id: settings.pane
    area: settings
    title: Settings
    root: data-surface
    reach:
      - >-
        the header gear · palette *Go to Settings* · `#settings`. The fleet's full Settings page
        (vendored settings-group): a modal dialog over the current tab, full screen on a phone and a
        centred 772px column on desktop, its title and **×** in a sticky header; **×** or Escape
        returns to the tab, which stays as it was under it. Under the header a line names what needs
        attention (*3 mails need you*, *Issue sync failing*, else *6 of 9 services on*), then six
        inset groups with sentence-case labels; each row shows its lead glyph, label, its current
        value (in the attention or danger tone when it is an exception) and a chevron. A row opens
        its **sheet**, a modal over the page on every width (the Email archiving report's sheet
        spans the window). `#settings/<row>` keeps a sheet across reload; Back closes it.
    links:
      - to: settings.sheet
  - id: settings.sheet
    area: settings
    title: Settings sheet
    root: data-surface
    reach:
      - "any Settings row that opens something · `#settings/<row>`."
    holds:
      - "a title, **×**, and the one sheet its row names (below)."
    does:
      - "**Done**, **×**, Escape and Back close it."
    phone: a modal sheet that fits the screen, **Done** pinned at the bottom whatever the sheet's length.
    desktop: a centred modal sheet over the Settings page; Email archiving's spans the window.
