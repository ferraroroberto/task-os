        via: the ⋮ beside an area or category
  - id: settings.search
    area: settings
    title: Search sheet
    root: data-surface
    reach:
      - "Settings → Search · `#settings/search`."
  - id: settings.opener
    area: settings
    title: Folder opener sheet
    root: data-surface
    reach:
      - "Settings → Folder opener · `#settings/opener`."
  - id: settings.voice
    area: settings
    title: Voice quick-add sheet
    root: data-surface
    reach:
      - "Settings → Voice quick-add · `#settings/voice`."
    states:
