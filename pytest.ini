[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
markers =
    windows_only: needs Windows-desktop state (the tray, PowerShell, the cmd opener); the Mac nightly deselects it with -m "not windows_only"
# Playwright: headless by default; the story tests set their own viewports.
# Windows: keep the default asyncio policy for pytest itself (uvicorn child
# processes pin the selector loop via --loop).
